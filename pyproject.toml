[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outcome-poc"
version = "0.1.0"
description = "Local outcome-aware context allocation experiment"
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
